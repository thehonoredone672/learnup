<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VSB College | LearnUp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="portal-page">
  <div class="portal-box">
    <div class="portal-logo">
      <div class="portal-mark">V</div>
      <div class="portal-org-name">VSB College</div>
      <div class="portal-powered">Resource portal, powered by LearnUp</div>
    </div>

    <div class="card portal-card">
      <a class="portal-option" href="student.html">
        <div class="icon-wrap">
          <svg class="icon" viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/></svg>
        </div>
        <div>
          <div class="portal-option-title">Student</div>
          <div class="portal-option-sub">Ask questions from your course materials</div>
        </div>
        <svg class="icon chev" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
      </a>
      <a class="portal-option" href="organization.html">
        <div class="icon-wrap">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>
        </div>
        <div>
          <div class="portal-option-title">Faculty / Admin</div>
          <div class="portal-option-sub">Upload and manage resources</div>
        </div>
        <svg class="icon chev" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
      </a>
    </div>

    <div class="portal-footnote">Prototype build — sample data for demonstration only</div>
  </div>
</div>

</body>
</html>
