<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course | LearnUp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="topbar" id="topbar"></div>

<div class="main">
  <div style="max-width:820px;margin:0 auto;">
    <div class="breadcrumb" style="font-size:12px;color:var(--text-faint);margin-bottom:8px;">
      <a href="/dashboard.html" style="color:var(--text-muted);">Courses</a> / <span id="crumb"></span>
    </div>
    <div class="main-header">
      <h1 id="title">Loading…</h1>
      <p id="desc"></p>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;">
      <h3 style="font-size:13.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;">Topics</h3>
      <div id="progress" style="font-size:12px;color:var(--text-muted);"></div>
    </div>
    <div class="card"><div class="topic-list" id="topics"></div></div>
  </div>
</div>

<script src="/app.js"></script>
<script>
if (!LU.requireAuth()) { /* redirected */ } else init();

async function init(){
  LU.renderTopbar(document.getElementById('topbar'), { subtitle: 'Course view' });
  const id = LU.qs('id');
  if (!id){ location.href = '/dashboard.html'; return; }
  try {
    const { course, topics } = await LU.api('/api/courses/' + id);
    document.title = course.title + ' | LearnUp';
    document.getElementById('crumb').textContent = course.title;
    document.getElementById('title').textContent = course.title;
    document.getElementById('desc').textContent = course.description;
    const done = topics.filter(t => t.completed).length;
    document.getElementById('progress').textContent = `${done} of ${topics.length} completed`;
    document.getElementById('topics').innerHTML = topics.map((t, i) => `
      <a class="topic-row ${t.completed ? 'done' : ''}" href="/topic.html?id=${t.id}">
        <div class="topic-num">${t.completed ? '✓' : (i+1)}</div>
        <div class="body">
          <div class="t">${LU.esc(t.title)}</div>
          <div class="m">${t.has_quiz ? 'Includes a quiz' : 'Reading only'}${t.completed ? ' · Completed' : ''}</div>
        </div>
        <svg class="icon chev" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
      </a>
    `).join('');
  } catch (e){
    document.getElementById('title').textContent = 'Course not found';
    document.getElementById('desc').textContent = e.message;
  }
}
</script>
</body>
</html>
