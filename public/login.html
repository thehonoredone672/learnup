<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in | LearnUp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-box">
    <div class="auth-brand">
      <div class="mark">L</div>
      <div class="title">LearnUp</div>
      <div class="sub">Digital learning platform</div>
    </div>

    <div class="card auth-card">
      <h2>Log in to your account</h2>
      <div class="auth-error" id="err"></div>
      <form id="loginForm">
        <div class="auth-row">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" required autocomplete="email" placeholder="you@college.edu">
        </div>
        <div class="auth-row">
          <label for="password">Password</label>
          <input class="input" id="password" name="password" type="password" required minlength="6" autocomplete="current-password" placeholder="At least 6 characters">
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Log in</button>
      </form>
      <div class="auth-swap">New to LearnUp? <a href="/register.html">Create an account</a></div>

      <div class="auth-hint">
        <strong>Demo accounts</strong> — click to prefill:<br>
        <a href="#" data-fill="dharnis@learnup.dev|student123">Student</a> ·
        <a href="#" data-fill="jeny@learnup.dev|instructor123">Instructor</a> ·
        <a href="#" data-fill="admin@learnup.dev|admin123">Admin</a>
      </div>
    </div>
  </div>
</div>

<script src="/app.js"></script>
<script>
const err = document.getElementById('err');
const emailEl = document.getElementById('email');
const passEl  = document.getElementById('password');
const btn     = document.getElementById('submitBtn');

document.querySelectorAll('a[data-fill]').forEach(a => {
  a.addEventListener('click', e => {
    e.preventDefault();
    const [em, pw] = a.getAttribute('data-fill').split('|');
    emailEl.value = em; passEl.value = pw;
    emailEl.focus();
  });
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  err.classList.remove('show'); err.textContent = '';
  btn.disabled = true; btn.textContent = 'Logging in…';
  try {
    const { user, token } = await LU.api('/api/auth/login', {
      method: 'POST',
      body: { email: emailEl.value.trim(), password: passEl.value },
    });
    LU.token = token; LU.user = user;
    const next = LU.qs('next') || '/dashboard.html';
    location.href = next;
  } catch (ex) {
    err.textContent = ex.message || 'Login failed';
    err.classList.add('show');
    btn.disabled = false; btn.textContent = 'Log in';
  }
});

// Already logged in? bounce to dashboard.
if (LU.token && LU.user) location.href = '/dashboard.html';
</script>
</body>
</html>
